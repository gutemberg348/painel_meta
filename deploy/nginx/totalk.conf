# O Certbot acrescentará o HTTPS a este site.
server {
    listen 80;
    server_name totalk.testes-techcode.shop;

    # A URL dos callbacks da FLW contém o segredo do webhook.
    access_log off;

    location / {
        # Até ativar o HTTPS, bloqueie o acesso ao painel em HTTP.
        if ($scheme = http) { return 403; }

        # Use a porta TOTALK_HOST_PORT do .env da VPS.
        proxy_pass http://127.0.0.1:3038;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

services:
  painel:
    build: .
    restart: unless-stopped
    stop_grace_period: 35s
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      TRUST_PROXY: "true"
      DATABASE_PATH: /app/data/totalk.sqlite
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
